name: Update OpenAlex citations

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch OpenAlex citation data
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_AUTHOR_ID: ${{ vars.OPENALEX_AUTHOR_ID || 'orcid:0009-0001-3432-3583' }}
        run: python scripts/fetch_openalex_citations.py

      - name: Commit updated citation data
        run: |
          if git diff --quiet -- assets/data/openalex-citations.json; then
            echo "Citation data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/openalex-citations.json
          git commit -m "Update OpenAlex citation data"
          git push
